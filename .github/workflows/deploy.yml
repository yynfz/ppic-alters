# PPIC Alter-S — deploy to ppic.mufakat.id (Docker + traefik)
#
# The target VPS runs traefik on ports 80/443, so this workflow rebuilds the
# app as a Docker container instead of rsync + PM2 + nginx.
# See docs/DEPLOYMENT.md → "Docker + Traefik".
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   SSH_HOST        — server hostname or IP
#   SSH_USER        — SSH username (ubuntu on the mufakat.id VPS)
#   SSH_PRIVATE_KEY — private key permitted to run docker on the server
#   SSH_PORT        — SSH port (optional, default 22)
#   DEPLOY_PATH     — server checkout path (e.g. /home/ubuntu/projects/ppic-alters)
#
# The server keeps its own .env (secrets are never pushed by CI). Without the
# secrets above this job fails fast; the container can still be deployed
# manually with `docker compose up -d --build`.

name: Deploy to ppic.mufakat.id

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ppic
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and restart container
    runs-on: ubuntu-latest
    # SSH_* live on the `deploy` environment, so the job must opt into it.
    environment: deploy
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"

            # Preserve the server-side .env (CODEBUDDY_API_KEY, PPIC_MODEL, ...)
            git fetch --prune origin main
            git checkout -q main
            git reset --hard origin/main

            docker compose build
            docker compose up -d --force-recreate

            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1/api/health -H 'Host: ppic.mufakat.id' > /dev/null 2>&1; then
                echo "Health check passed"
                exit 0
              fi
              sleep 2
            done

            echo "Health check failed"
            docker logs --tail 50 ppic-alters
            exit 1
